<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>友链</title>
<!--SEO-->
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m)})();</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap">
  <section class="hero">
    <h1>友链</h1>
    <p>每 20 分钟自动检测一次可访问状态，绿点表示当前在线。</p>
  </section>

  <section class="friend-apply">
    <h2>想交换友链？</h2>
    <p>把下面这条放进你的友链页，然后到 <a href="https://github.com/Exia-blip" target="_blank" rel="noopener me">GitHub @Exia-blip</a> 说一声。</p>
    <pre><code>&lt;a href="https://exia.de5.net/" title="Exia Blog"&gt;Exia Blog&lt;/a&gt;</code></pre>
    <p class="fa-note">要求：原创为主、HTTPS 打得开、本站已经在你的友链里。加完说一声就行——这边每 20 分钟自动检测一轮，点进去能通就算数。</p>
  </section>

  <div class="friend-grid" id="grid"></div>

  <section id="admin-box" style="display:none;margin-bottom:70px">
    <h3 id="form-title" style="font-size:15px;font-family:var(--serif);margin:0 0 12px">添加友链</h3>
    <form id="add-form" style="display:grid;gap:9px;grid-template-columns:1fr 1fr;max-width:560px">
      <input type="text" name="name" placeholder="站点名称 *" required maxlength="60">
      <input type="url" name="url" placeholder="https://... *" required maxlength="300">
      <input type="url" name="avatar" placeholder="头像地址（可选）" maxlength="300">
      <input type="text" name="desc" placeholder="一句话描述（可选）" maxlength="120">
      <div style="grid-column:1/-1;display:flex;gap:9px;align-items:center">
        <button class="btn primary sm" type="submit" id="submit-btn">添加</button>
        <button class="btn sm" type="button" id="cancel-edit" hidden>取消</button>
        <button class="btn sm" type="button" id="recheck" style="margin-left:auto">立即重新检测</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
import { api, esc, mountHeader, toast } from '/app.js';

const grid = document.getElementById('grid');

// Worker 已经把卡片渲染进 HTML 了。有这份数据就不重建 DOM，
// 只补管理员才有的删除按钮——否则爬虫抓到的是一坨占位骨架，用户首屏也会闪一下。
const SEED = window.__FRIENDS__ || null;
let CACHE = (SEED && Array.isArray(SEED.friends)) ? SEED.friends : [];

// 与 Worker 的 friendIcon 同一套规则：有自家头像才出图，否则首字母方块。
// 不再回 Google 的 s2/favicons —— 那是一个友链一次第三方请求。
function iconHTML(f) {
  if (f.avatar) return `<img class="fav" src="${esc(f.avatar)}" alt="" loading="lazy" decoding="async" width="38" height="38">`;
  const ch = String(f.name || '?').trim().charAt(0).toUpperCase() || '?';
  return `<span class="fav ph" aria-hidden="true">${esc(ch)}</span>`;
}

let USER_ADMIN = false;

/* 管理员在卡片右上角挂两个按钮。编辑复用页面底部同一个表单 ——
   改一条友链不该让人重打四个字段，也不该经过「删掉再加回来」这种会丢 id 的路径。 */
const PAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function bindAdminActions() {
  if (!USER_ADMIN) return;
  grid.querySelectorAll('.friend-card').forEach((a) => {
    if (a.querySelector('.fc-act')) return;
    const id = a.dataset.id;
    if (!id) return;

    const box = document.createElement('span');
    box.className = 'fc-act';
    box.innerHTML =
      `<button class="fc-btn" type="button" data-edit title="编辑">${PAY}</button>` +
      '<button class="fc-btn" type="button" data-del title="删除">×</button>';

    box.querySelector('[data-del]').onclick = async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!confirm('删除这条友链？')) return;
      await api('/api/friends/' + id, { method: 'DELETE' });
      toast('已删除');
      load();
    };

    box.querySelector('[data-edit]').onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      startEdit(id);
    };

    a.appendChild(box);
  });
}

// 与 Worker 的 friendsBody 同一套三态规则：1 正常 / 2 有响应但状态异常 / 0 拿不到响应
function dotState(f) {
  const n = Number(f.status);
  return n === 1 ? 'on' : n === 2 ? 'warn' : 'off';
}
function dotLabel(f) {
  const st = dotState(f);
  const base = st === 'on' ? '可访问' : st === 'warn' ? `有响应（HTTP ${f.http_status || '?'}）` : '无法访问';
  return f.latency_ms > 0 ? `${base} · ${f.latency_ms}ms` : base;
}

function paint(friends) {
  CACHE = friends;
  if (!friends.length) {
    grid.innerHTML = '<div class="empty">还没有友链</div>';
    return;
  }
  grid.innerHTML = friends.map((f) => `
      <a class="friend-card" href="${esc(f.url)}" target="_blank" rel="noopener" data-id="${f.id}">
        ${iconHTML(f)}
        <div class="info">
          <div class="nm">
            <span class="dot ${dotState(f)}" title="${dotLabel(f)}"></span>
            ${esc(f.name)}
          </div>
          <div class="ds">${esc(f.desc || new URL(f.url).hostname)}</div>
        </div>
      </a>`).join('');
  bindAdminActions();
}

async function load() {
  try {
    const { friends } = await api('/api/friends');
    paint(friends);
  } catch (e) {
    // 首屏已经有 SSR 内容时，刷新失败不该把页面清空
    if (!SEED) grid.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

const user = await mountHeader('friends');
USER_ADMIN = !!(user && user.is_admin);
if (USER_ADMIN) document.getElementById('admin-box').style.display = 'block';

if (SEED) bindAdminActions();
else load();

const form = document.getElementById('add-form');
const formTitle = document.getElementById('form-title');
const submitBtn = document.getElementById('submit-btn');
const cancelBtn = document.getElementById('cancel-edit');
let editingId = null;

function resetForm() {
  editingId = null;
  form?.reset();
  if (formTitle) formTitle.textContent = '添加友链';
  if (submitBtn) submitBtn.textContent = '添加';
  if (cancelBtn) cancelBtn.hidden = true;
}

function startEdit(id) {
  const f = CACHE.find((x) => String(x.id) === String(id));
  if (!f) { toast('数据已过期，刷新一下'); return; }
  editingId = id;
  // 必须走 form.elements：form.name 是 <form> 自己的 name 属性（字符串），不是输入框
  const el = form.elements;
  el.name.value = f.name || '';
  el.url.value = f.url || '';
  el.avatar.value = f.avatar || '';
  el.desc.value = f.desc || '';
  formTitle.textContent = `编辑友链 #${id}`;
  submitBtn.textContent = '保存修改';
  cancelBtn.hidden = false;
  document.getElementById('admin-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.name.focus({ preventScroll: true });
}

cancelBtn?.addEventListener('click', resetForm);

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  // 用 FormData 取值：form.name 拿到的是 <form> 的 name 属性（空串），不是输入框
  const d = new FormData(e.target);
  const body = {
    name: d.get('name') || '',
    url: d.get('url') || '',
    avatar: d.get('avatar') || '',
    desc: d.get('desc') || '',
  };
  const id = editingId;
  try {
    const r = await api(id ? '/api/friends/' + id : '/api/friends', {
      method: id ? 'PATCH' : 'POST',
      body,
    });
    resetForm();
    toast(id ? (r.recheck ? '已保存，地址变了，正在重新检测…' : '已保存') : '已添加，正在检测状态…');
    setTimeout(load, id ? (r.recheck ? 1500 : 0) : 1500);
  } catch (err) { toast(err.message); }
});

document.getElementById('recheck')?.addEventListener('click', async () => {
  toast('检测中…', 6000);
  try {
    const r = await api('/api/friends/check', { method: 'POST' });
    toast(`检测完成，共 ${r.checked} 个`);
    load();
  } catch (e) { toast(e.message); }
});
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>栏目</title>
<!--SEO-->
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m)})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap" id="main" tabindex="-1">
  <section class="hero">
    <h1 id="hero-title">栏目</h1>
    <p id="hero-sub">栏目回答「这是什么类型的东西」，标签回答「用什么做的 / 拆的是什么」</p>
  </section>

  <section class="tax-section">
    <div class="tax-head">
      <h2>栏目</h2>
      <span class="tiny muted" id="cat-total"><!--CAT-TOTAL--></span>
    </div>
    <div class="tax-grid" id="cat-grid"><!--CATS--></div>
  </section>

  <section class="tax-section">
    <div class="tax-head">
      <h2>标签</h2>
      <span class="tiny muted" id="tag-total"><!--TAG-TOTAL--></span>
    </div>
    <div class="tax-grid" id="tag-grid"><!--TAGS--></div>
  </section>
</main>

<script type="module">
import { api, esc, mountHeader, site } from '/app.js';

const tagGrid = document.getElementById('tag-grid');
const tagTotal = document.getElementById('tag-total');
const catTotal = document.getElementById('cat-total');

const SITE = await site();
document.title = `栏目 · ${SITE.name}`;

// 栏目的 HTML 已由 Worker 服务端渲染好（四栏固定，含空栏目），
// 这里只补标签云：标签是动态的，服务端渲染价值不如栏目页大。
async function loadTags() {
  try {
    const { tags } = await api('/api/tags');
    if (!tags.length) {
      tagGrid.innerHTML = '<div class="empty">还没有标签。正文里写 <code>#标签</code> 会自动归集。</div>';
      tagTotal.textContent = '';
      return;
    }
    tagGrid.innerHTML = tags
      .map(
        (t) => `<a class="tax-cell" href="/tag/${encodeURIComponent(t.name)}">
          <span class="tax-name">#${esc(t.name)}</span>
          <span class="tax-count">${t.count}</span>
        </a>`
      )
      .join('');
    tagTotal.textContent = `${tags.length} 个标签`;
  } catch {
    tagGrid.innerHTML = '<div class="empty">标签加载失败，刷新试试</div>';
  }
}

// 栏目数量随发文变化，SSR 那份可能已经旧了；这里静默对齐一次数字
async function syncCatCounts() {
  try {
    const { categories } = await api('/api/categories');
    if (!categories) return;
    for (const c of categories) {
      const el = document.querySelector(`#cat-grid a[href="/cat/${c.slug}"] .tax-count`);
      if (el) el.textContent = c.count;
    }
    const sum = categories.reduce((a, b) => a + b.count, 0);
    if (catTotal) catTotal.textContent = `${categories.length} 个栏目 · ${sum} 篇`;
  } catch {}
}

mountHeader('categories');
syncCatCounts();

// 标签云已由 Worker 直出（模板里的 TAGS 占位符在服务端就被替换了）。
// 只有服务端没给出来（查库失败 / 站点还没有标签）时才自己拉一次。
const tagsRendered = document.querySelectorAll('#tag-grid a.tax-cell').length > 0;
if (!tagsRendered) loadTags();
</script>
</body>
</html>

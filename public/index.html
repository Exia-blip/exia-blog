<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页</title>
<!--SEO-->
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m)})();</script>
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
</head>
<body>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap home">
  <section class="hero">
    <div class="hero-deco" aria-hidden="true">
      <svg viewBox="0 0 1080 240" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hd-g1" cx="50%" cy="50%" r="50%">
            <stop offset="0" style="stop-color:#5b78ff;stop-opacity:.26"/>
            <stop offset=".55" style="stop-color:#5b78ff;stop-opacity:.10"/>
            <stop offset="1" style="stop-color:#5b78ff;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="hd-g2" cx="50%" cy="50%" r="50%">
            <stop offset="0" style="stop-color:#b98cff;stop-opacity:.24"/>
            <stop offset=".55" style="stop-color:#b98cff;stop-opacity:.09"/>
            <stop offset="1" style="stop-color:#b98cff;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="hd-g3" cx="50%" cy="50%" r="50%">
            <stop offset="0" style="stop-color:#63d6e8;stop-opacity:.18"/>
            <stop offset="1" style="stop-color:#63d6e8;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="hd-fade1" cx="15%" cy="50%" r="64%">
            <stop offset="0" style="stop-color:#fff;stop-opacity:1"/>
            <stop offset=".55" style="stop-color:#fff;stop-opacity:.42"/>
            <stop offset="1" style="stop-color:#fff;stop-opacity:0"/>
          </radialGradient>
          <radialGradient id="hd-fade2" cx="85%" cy="50%" r="64%">
            <stop offset="0" style="stop-color:#fff;stop-opacity:1"/>
            <stop offset=".55" style="stop-color:#fff;stop-opacity:.42"/>
            <stop offset="1" style="stop-color:#fff;stop-opacity:0"/>
          </radialGradient>
          <pattern id="hd-dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="1.5" cy="1.5" r="1.35" fill="currentColor" fill-opacity=".22"/>
          </pattern>
          <mask id="hd-m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="240">
            <rect x="0" y="0" width="320" height="240" fill="url(#hd-fade1)"/>
          </mask>
          <mask id="hd-m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="240">
            <rect x="760" y="0" width="320" height="240" fill="url(#hd-fade2)"/>
          </mask>
          <symbol id="hd-star" viewBox="-10 -10 20 20">
            <path d="M0-9C1.2-2.6 2.6-1.2 9 0 2.6 1.2 1.2 2.6 0 9-1.2 2.6-2.6 1.2-9 0-2.6-1.2-1.2-2.6 0-9Z"/>
          </symbol>
        </defs>

        <ellipse cx="118" cy="4" rx="340" ry="210" fill="url(#hd-g1)"/>
        <ellipse cx="978" cy="22" rx="310" ry="196" fill="url(#hd-g2)"/>
        <ellipse cx="1016" cy="242" rx="250" ry="140" fill="url(#hd-g3)"/>

        <circle cx="30" cy="40" r="154" stroke="#5b78ff" stroke-opacity=".13" stroke-width="1.1"/>
        <circle cx="1058" cy="218" r="188" stroke="#b98cff" stroke-opacity=".15" stroke-width="1.1"/>
        <circle cx="1058" cy="218" r="134" stroke="#5b78ff" stroke-opacity=".11" stroke-width="1" stroke-dasharray="2 9"/>
        <path d="M-24 202Q60 158 132 194" stroke="#63d6e8" stroke-opacity=".34" stroke-width="1.2"/>
        <path d="M948 62Q1014 22 1092 46" stroke="#b98cff" stroke-opacity=".26" stroke-width="1.2"/>

        <rect x="0" y="-8" width="320" height="248" fill="url(#hd-dots)" mask="url(#hd-m1)"/>
        <rect x="760" y="-8" width="320" height="248" fill="url(#hd-dots)" mask="url(#hd-m2)"/>

        <use href="#hd-star" x="196" y="36" width="12" height="12" fill="#5b78ff" fill-opacity=".38"/>
        <use href="#hd-star" x="88" y="170" width="7" height="7" fill="#63d6e8" fill-opacity=".46"/>
        <use href="#hd-star" x="150" y="96" width="6" height="6" fill="#b98cff" fill-opacity=".4"/>
        <use href="#hd-star" x="842" y="120" width="9" height="9" fill="#b98cff" fill-opacity=".4"/>
        <use href="#hd-star" x="896" y="196" width="6" height="6" fill="#5b78ff" fill-opacity=".34"/>
        <use href="#hd-star" x="1006" y="64" width="8" height="8" fill="#63d6e8" fill-opacity=".42"/>
      </svg>
    </div>
    <h1 id="hero-title">写字的地方</h1>
    <p id="hero-sub">记录思考、代码与生活。</p>
  </section>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="搜索标题或正文…" autocomplete="off">
    </div>
    <a class="btn sm" href="/friends">友链</a>
  </div>

  <div class="tagbar" id="catbar"></div>

  <div class="tagbar" id="tagbar"></div>

  <div class="post-list" id="list" aria-live="polite">
    <!--LIST-->
  </div>

  <div class="pagination" id="pager"><!--PAGER--></div>
</main>

<script type="module">
import { api, fmtDate, esc, mountHeader, toast, site } from '/app.js';
import { autoCover } from '/cover.js';

const listEl = document.getElementById('list');
const tagbarEl = document.getElementById('tagbar');
const catbarEl = document.getElementById('catbar');
const pagerEl = document.getElementById('pager');
const qInput = document.getElementById('q');

// 路由：/tag/名字 或 /?q=
const pathParts = location.pathname.split('/').filter(Boolean);
let currentTag = pathParts[0] === 'tag' ? decodeURIComponent(pathParts[1] || '') : '';
let currentCat = pathParts[0] === 'cat' ? decodeURIComponent(pathParts[1] || '') : '';
let currentQ = new URLSearchParams(location.search).get('q') || '';
let page = parseInt(new URLSearchParams(location.search).get('page') || '1', 10) || 1;

qInput.value = currentQ;

const SITE = await site();

if (currentCat) {
  // 服务端已经按栏目名渲染过一遍，这里只在客户端兜底（栏目改名/直接改 URL 时）
  const C = window.__CAT__ || {};
  const cname = C.name || currentCat;
  document.getElementById('hero-title').textContent = cname;
  document.getElementById('hero-sub').textContent = C.desc || `栏目「${cname}」下的全部文章`;
  document.title = `${cname} · ${SITE.name}`;
} else if (currentTag) {
  // 标签页的 H1 与 title 已由 Worker 按路径服务端渲染好，这里只在 SSR 没跑到时兜底
  if (!document.title.startsWith('#')) {
    document.getElementById('hero-title').textContent = `#${currentTag}`;
    document.getElementById('hero-sub').textContent = `标签「${currentTag}」下的全部文章`;
    document.title = `#${currentTag} · ${SITE.name}`;
  }
} else if (currentQ) {
  document.getElementById('hero-title').textContent = `搜索：${currentQ}`;
  document.getElementById('hero-sub').textContent = '标题与正文关键词匹配';
  document.title = `${currentQ} · 搜索`;
} else {
  document.getElementById('hero-title').textContent = SITE.name;
  document.getElementById('hero-sub').textContent = SITE.desc || '记录思考、代码与生活。';
  document.title = SITE.name;
}

let ctrl = null;

async function load() {
  // 连打关键词时只保留最后一次请求，避免旧结果盖住新结果
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const mine = ctrl;

  listEl.setAttribute('aria-busy', 'true');
  listEl.innerHTML = skeleton();

  const params = new URLSearchParams({ page: String(page), size: '10' });
  if (currentTag) params.set('tag', currentTag);
  if (currentCat) params.set('cat', currentCat);
  if (currentQ) params.set('q', currentQ);

  try {
    const { posts, total, pages } = await api('/api/posts?' + params, { signal: mine.signal });
    if (mine !== ctrl) return;
    if (!posts.length) {
      listEl.innerHTML = `<div class="empty">${currentQ ? '没有找到匹配的文章' : '还没有文章，去写第一篇吧'}</div>`;
      pagerEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = posts.map(card).join('');
    renderPager(pages, total);
  } catch (e) {
    if (e.name === 'AbortError' || mine !== ctrl) return;
    listEl.innerHTML = `<div class="empty">加载失败：${esc(e.message)}<br><a class="btn sm" href="javascript:location.reload()" style="margin-top:12px">重试</a></div>`;
  } finally {
    if (mine === ctrl) listEl.setAttribute('aria-busy', 'false');
  }
}

function skeleton(n = 3) {
  return Array.from({ length: n })
    .map(
      () =>
        '<div class="sk-card"><div class="sk sk-thumb"></div><div class="sk-body"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>'
    )
    .join('');
}

function card(p) {
  return `
  <a class="post-card" href="/p/${encodeURIComponent(p.slug)}">
    <img class="thumb" src="${esc(p.cover || autoCover(p))}" alt="" loading="lazy" decoding="async" width="208" height="136">
    <div class="body">
      <h2>${esc(p.title)}${p.is_private ? ' <span class="tiny muted">私密</span>' : ''}</h2>
      ${p.excerpt ? `<p class="excerpt">${esc(p.excerpt)}</p>` : ''}
      <div class="meta">
        <span>${fmtDate(p.published_at || p.created_at)}</span>
        <span class="sep-dot">${p.reading} 分钟</span>
        ${p.comments ? `<span class="sep-dot">${p.comments} 条评论</span>` : ''}
        ${p.category ? `<span class="tag cat-chip">${esc(p.category_name || p.category)}</span>` : ''}
        ${(p.tags || []).slice(0, 3).map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}
      </div>
    </div>
  </a>`;
}

function renderPager(pages, total) {
  if (pages <= 1) { pagerEl.innerHTML = ''; return; }
  const qs = (p) => {
    const u = new URLSearchParams();
    if (currentQ) u.set('q', currentQ);
    u.set('page', String(p));
    const base = currentCat
      ? `/cat/${encodeURIComponent(currentCat)}?`
      : currentTag
        ? `/tag/${encodeURIComponent(currentTag)}?`
        : '/?';
    return base + u.toString();
  };
  pagerEl.innerHTML = `
    ${page > 1 ? `<a class="btn sm" href="${qs(page - 1)}">← 上一页</a>` : ''}
    <span class="page-info">${page} / ${pages}　共 ${total} 篇</span>
    ${page < pages ? `<a class="btn sm" href="${qs(page + 1)}">下一页 →</a>` : ''}`;
}

async function loadCats() {
  try {
    const { categories } = await api('/api/categories');
    if (!categories.length) { catbarEl.innerHTML = ''; return; }
    catbarEl.innerHTML =
      `<span class="bar-label">栏目</span>` +
      `<a class="tag" href="/" style="${!currentCat && !currentTag ? 'background:var(--accent-soft);color:var(--accent)' : ''}">全部</a>` +
      categories.map((c) => `<a class="tag cat-chip" href="/cat/${encodeURIComponent(c.slug)}" title="${esc(c.desc || '')}"
        style="${currentCat === c.slug ? 'background:var(--accent-soft);color:var(--accent)' : ''}">${esc(c.name)} ${c.count}</a>`).join('');
  } catch {}
}

async function loadTags() {
  try {
    const { tags } = await api('/api/tags');
    if (!tags.length) return;
    tagbarEl.innerHTML =
      `<span class="bar-label">标签</span>` +
      `<a class="tag" href="/" style="${!currentTag ? 'background:var(--accent-soft);color:var(--accent)' : ''}">全部</a>` +
      tags.map((t) => `<a class="tag" href="/tag/${encodeURIComponent(t.name)}"
        style="${currentTag === t.name ? 'background:var(--accent-soft);color:var(--accent)' : ''}">#${esc(t.name)} ${t.count}</a>`).join('');
  } catch {}
}

let timer;
qInput.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const v = qInput.value.trim();
    const url = new URL(location.href);
    if (v) url.searchParams.set('q', v); else url.searchParams.delete('q');
    url.searchParams.delete('page');
    if (currentCat) {
      location.href = `/cat/${encodeURIComponent(currentCat)}${v ? '?q=' + encodeURIComponent(v) : ''}`;
    } else if (currentTag) {
      location.href = `/tag/${encodeURIComponent(currentTag)}${v ? '?q=' + encodeURIComponent(v) : ''}`;
    } else {
      history.replaceState(null, '', url);
      currentQ = v;
      page = 1;
      document.getElementById('hero-title').textContent = v ? `搜索：${v}` : SITE.name;
      document.getElementById('hero-sub').textContent = v
        ? '标题与正文关键词匹配'
        : SITE.desc || '记录思考、代码与生活。';
      load();
    }
  }, 320);
});

mountHeader(currentTag ? 'tag' : currentCat ? 'cat' : 'home');
loadCats();
loadTags();

// 文章列表与分页已经由服务端渲染好了，只有搜索要走接口
const BOOT = window.__LIST__;
if (!BOOT || currentQ) load();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页</title>
<!--SEO-->
<!--THEME-->
<!--THEMEBOOT-->
<link rel="stylesheet" href="/style.css">
<script src="/boot.js" defer></script>
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap home desk" id="main" tabindex="-1">
  <section class="hero">
    <div class="hero-main">
      <p class="hero-kicker">EXIA BLOG</p>
      <h1 id="hero-title">写字的地方</h1>
      <p id="hero-sub">记录思考、代码与生活。</p>
      <div class="hero-acts">
        <a class="hero-btn b-blue" href="#list">开始阅读</a>
        <a class="hero-btn b-orange" href="/archive">按时间归档</a>
        <a class="hero-btn b-green" href="/categories">栏目与标签</a>
      </div>
    </div>
    <a class="hero-feature" id="hero-feature" href="/archive">
      <img class="hf-img" src="/og-default.jpg" alt="" width="640" height="336" loading="eager" decoding="async">
      <span class="hf-mask"></span>
      <span class="hf-tag">最新</span>
      <span class="hf-title" id="hf-title">从最新一篇开始</span>
    </a>
  </section>

  <div class="home-shell">
    <section class="home-main">
      <div class="toolbar">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr-only" for="q">搜索文章标题或正文</label>
          <input id="q" type="text" placeholder="搜索标题或正文…" aria-label="搜索标题或正文" autocomplete="off">
          <button type="button" class="search-clear" id="q-clear" aria-label="清除搜索" title="清除搜索" hidden>✕</button>
        </div>
        <a class="btn sm" href="/friends">友链</a>
      </div>

      <!-- 这两条筛选栏由服务端直出。原来是空 div、等 app.js 拉完接口才填，
           结果首屏渲染完再过一两百毫秒整块内容往下推 90 多像素 —— CLS 全在这儿。 -->
      <div class="tagbar" id="catbar"><!--CATBAR--></div>

      <div class="post-list" id="list" aria-live="polite">
        <!--LIST-->
      </div>

      <nav class="pagination" id="pager" aria-label="分页"><!--PAGER--></nav>
    </section>

    <aside class="home-side" aria-label="站点信息">
      <!-- 手机上三块收进 <details>：默认收起，点一下才占位置。
           模板里带 open，脚本被拦或停用时三块照样是展开的（退回改版前的样子，
           不是丢内容）；桌面 summary 直接 display:none，details 恒开。 -->
      <details class="side-fold" id="side-fold" open>
        <summary class="side-fold-bar"><span>站点信息</span><i>作者 · 标签 · 最新</i></summary>
        <div class="side-fold-body">
          <section class="widget author-widget">
            <div class="aw-cover"><span class="aw-dot"></span></div>
            <div class="aw-avatar" id="aw-avatar" aria-hidden="true">E</div>
            <b class="aw-name" id="aw-name">Exia Blog</b>
            <p class="aw-desc" id="aw-desc">写字的地方</p>
            <div class="aw-links">
              <a href="https://github.com/Exia-blip" target="_blank" rel="noopener noreferrer">GitHub</a>
              <a href="/rss.xml">RSS</a>
            </div>
          </section>
          <section class="widget">
            <h2 class="wg-title">标签</h2>
            <div class="side-tags" id="side-tags"><!--SIDETAGS--></div>
          </section>
          <section class="widget">
            <h2 class="wg-title">最近</h2>
            <ul class="side-recent" id="side-recent"><!--SIDERECENT--></ul>
          </section>
        </div>
      </details>
    </aside>
  </div>
</main>

<script type="module">
import { api, fmtDate, esc, mountHeader, toast, site } from '/app.js';
import { autoThumb } from '/cover.js';

const listEl = document.getElementById('list');
const catbarEl = document.getElementById('catbar');
const pagerEl = document.getElementById('pager');
const qInput = document.getElementById('q');

/* 侧栏折叠：只在窄屏收起。模板带 open（见 aside 那里的注释），这里按断点同步，
   跨过 1079 时跟着切 —— 从手机拉到桌面，正文旁边不该只剩一条「站点信息」。 */
const foldEl = document.getElementById('side-fold');
if (foldEl) {
  const mq = matchMedia('(max-width: 1079px)');
  const syncFold = () => { foldEl.open = !mq.matches; };
  syncFold();
  if (mq.addEventListener) mq.addEventListener('change', syncFold);
}

// 路由：/tag/名字 或 /?q=
const pathParts = location.pathname.split('/').filter(Boolean);
let currentTag = pathParts[0] === 'tag' ? decodeURIComponent(pathParts[1] || '') : '';
let currentCat = pathParts[0] === 'cat' ? decodeURIComponent(pathParts[1] || '') : '';
let currentQ = new URLSearchParams(location.search).get('q') || '';
let page = parseInt(new URLSearchParams(location.search).get('page') || '1', 10) || 1;

qInput.value = currentQ;

const SITE = await site();

/* 侧栏作者卡：站点名/描述/头像都来自 settings，模板里先放占位再替换，
   避免右栏在 API 回来前空一块。 */
const awName = document.getElementById('aw-name');
const awDesc = document.getElementById('aw-desc');
const awAva = document.getElementById('aw-avatar');
if (awName) awName.textContent = SITE.name || 'Exia Blog';
if (awDesc) awDesc.textContent = SITE.desc || '记录思考、代码与生活。';
if (awAva && SITE.avatar) {
  awAva.classList.add('has-img');
  awAva.style.backgroundImage = `url("${SITE.avatar.replace(/"/g, '%22')}")`;
  awAva.textContent = '';
}

if (currentCat) {
  // 服务端已经按栏目名渲染过一遍，这里只在客户端兜底（栏目改名/直接改 URL 时）
  const C = window.__CAT__ || {};
  const cname = C.name || currentCat;
  document.getElementById('hero-title').textContent = cname;
  document.getElementById('hero-sub').textContent = C.desc || `栏目「${cname}」下的全部文章`;
  document.title = `${cname} · ${SITE.name}`;
} else if (currentTag) {
  // 标签页的 H1 与 title 已由 Worker 按路径服务端渲染好，这里只在 SSR 没跑到时兜底
  if (!document.title.startsWith('#')) {
    document.getElementById('hero-title').textContent = `#${currentTag}`;
    document.getElementById('hero-sub').textContent = `标签「${currentTag}」下的全部文章`;
    document.title = `#${currentTag} · ${SITE.name}`;
  }
} else if (currentQ) {
  document.getElementById('hero-title').textContent = `搜索：${currentQ}`;
  document.getElementById('hero-sub').textContent = '标题、正文与标签关键词匹配';
  document.title = `${currentQ} · 搜索`;
} else {
  // 首页 hero：H1 用 tagline（site.desc「写字的地方」），不与顶栏品牌「Exia Blog」重复
  document.getElementById('hero-title').textContent = SITE.desc || '写字的地方';
  document.getElementById('hero-sub').textContent = '记录思考、代码与生活。';
  document.title = SITE.name;
}

let ctrl = null;
// 上一个已上报的搜索词：输入框防抖期间的同词不重复上报
let lastQ = '';

async function load() {
  // 连打关键词时只保留最后一次请求，避免旧结果盖住新结果
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const mine = ctrl;

  listEl.setAttribute('aria-busy', 'true');
  listEl.innerHTML = skeleton();

  const params = new URLSearchParams({ page: String(page), size: '10' });
  if (currentTag) params.set('tag', currentTag);
  if (currentCat) params.set('cat', currentCat);
  if (currentQ) params.set('q', currentQ);

  try {
    const { posts, total, pages } = await api('/api/posts?' + params, { signal: mine.signal });
    if (mine !== ctrl) return;
    /* 搜索埋点。只在第一页报，且同一个词只报一次 ——
       输入框是 320ms 防抖的，一次「rust」会先后打出「r」「ru」「rus」，
       全记下来得到的不是搜索意图，是打字速度。服务端另一头还有一层
       同人同日同词去重，两道一起才干净。 */
    if (currentQ && page === 1 && currentQ !== lastQ) {
      lastQ = currentQ;
      if (window.__ev) window.__ev('search', currentQ);
    }
    if (!posts.length) {
      listEl.innerHTML = currentQ ? emptySearch() : `<div class="empty">还没有文章，去写第一篇吧</div>`;
      pagerEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = posts.map(card).join('');
    renderPager(pages, total);

    /* 首屏横幅右侧跟着本页最新一篇走。标签页 / 栏目页也填 —— 与 SSR 保持同一口径：
       那边早就不看 res.base 了，客户端只对首页生效的话，接口降级时这两页会退回
       静态壳里的 og-default（1200×630 塞进 428×292 会被裁坏）。搜索页不抢这条位。 */
    if (!currentQ && page === 1) {
      const f = posts[0];
      const feat = document.getElementById('hero-feature');
      if (feat && f) {
        feat.href = `/p/${encodeURIComponent(f.slug)}`;
        const t = document.getElementById('hf-title');
        if (t) t.textContent = f.title;
        const img = feat.querySelector('.hf-img');
        if (img) img.src = f.cover || autoThumb(f);
      }
    }
  } catch (e) {
    if (e.name === 'AbortError' || mine !== ctrl) return;
    listEl.innerHTML = `<div class="empty">加载失败：${esc(e.message)}<br><button type="button" class="btn sm" data-reload style="margin-top:12px">重试</button></div>`;
    listEl.querySelector('[data-reload]')?.addEventListener('click', () => location.reload());
  } finally {
    if (mine === ctrl) listEl.setAttribute('aria-busy', 'false');
  }
}

function skeleton(n = 4) {
  return Array.from({ length: n })
    .map(
      () =>
        '<div class="sk-card"><div class="sk sk-cover"></div><div class="sk-body"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>'
    )
    .join('');
}

/* 关键词高亮：先按原文切段、再逐段转义。
   反过来做（先 esc 再匹配）的话，query 里带 & < 这类字符就永远匹配不到自己转义后的形式，
   而带正则元字符的 query（`c++`、`a.b`）又会直接抛错。 */
function hl(text, q) {
  const s = String(text ?? '');
  const needle = String(q || '').trim();
  if (!needle) return esc(s);
  let re;
  try {
    re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  } catch {
    return esc(s);
  }
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(s.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* 空结果页。原来只有一句「没有找到匹配的文章」——用户既不知道搜的是什么，
   也不知道下一步能干什么。这里把关键词回显出来，再给两条明确的出口。 */
function emptySearch() {
  return `<div class="empty empty-search">
    <p class="es-t">没有找到与「${esc(currentQ)}」相关的文章</p>
    <p class="es-h">试着换个更短的关键词，或者从栏目、标签翻进去。</p>
    <div class="es-acts">
      <a class="btn sm" href="/">看全部文章</a>
      <a class="btn sm" href="/archive">按时间归档</a>
    </div>
  </div>`;
}

function card(p) {
  const kicker = [
    p.category ? `<span class="card-cat">${esc(p.category_name || p.category)}</span>` : '',
    ...(p.tags || []).slice(0, 2).map((t) => `<span class="card-tag">#${hl(t, currentQ)}</span>`),
  ].join('');
  return `
  <a class="post-card" href="/p/${encodeURIComponent(p.slug)}">
    <div class="card-cover"><img class="thumb" src="${esc(p.cover || autoThumb(p))}" alt="" loading="lazy" decoding="async" width="640" height="360"></div>
    <div class="card-body">
      ${kicker ? `<div class="card-kicker">${kicker}</div>` : ''}
      <h2>${hl(p.title, currentQ)}${p.is_private ? ' <span class="tiny muted">私密</span>' : ''}</h2>
      ${p.excerpt ? `<p class="excerpt">${hl(p.excerpt, currentQ)}</p>` : ''}
      <div class="card-meta">
        <span>${fmtDate(p.published_at || p.created_at)}</span>
        <span>${p.reading} 分钟</span>
        ${p.comments ? `<span>${p.comments} 条评论</span>` : ''}
      </div>
    </div>
  </a>`;
}

function renderPager(pages, total) {
  if (pages <= 1) { pagerEl.innerHTML = ''; return; }
  const qs = (p) => {
    const u = new URLSearchParams();
    if (currentQ) u.set('q', currentQ);
    u.set('page', String(p));
    const base = currentCat
      ? `/cat/${encodeURIComponent(currentCat)}?`
      : currentTag
        ? `/tag/${encodeURIComponent(currentTag)}?`
        : '/?';
    return base + u.toString();
  };
  pagerEl.innerHTML = `
    ${page > 1 ? `<a class="btn sm" href="${qs(page - 1)}">← 上一页</a>` : ''}
    <span class="page-info">${page} / ${pages}　共 ${total} 篇</span>
    ${page < pages ? `<a class="btn sm" href="${qs(page + 1)}">下一页 →</a>` : ''}`;
}

/* 栏目筛选栏服务端已经画好了（src/index.js 的 renderListBars）。
   这里再 innerHTML 一遍，内容虽然一样，浏览器仍要重新布局一次 ——
   而这一下正是 CLS 的来源。SSR 给出来了就不再碰；只有 SSR 没给
   （接口挂了、或者模板换了别的版本）才落回客户端渲染。
   标签筛选栏 2026-11-28 整块删掉了：`main.home #tagbar{display:none}`
   一直挂着，SSR 在渲染、客户端在填充、CSS 在隐藏，三头都白跑。 */
const ssrBar = catbarEl.childElementCount > 0;

async function loadCats() {
  if (ssrBar) return;
  try {
    const { categories } = await api('/api/categories');
    if (!categories.length) { catbarEl.innerHTML = ''; return; }
    catbarEl.innerHTML =
      `<a class="tag" href="/" style="${!currentCat && !currentTag ? 'background:var(--accent-soft);color:var(--accent)' : ''}">全部</a>` +
      categories.map((c) => `<a class="tag cat-chip" href="/cat/${encodeURIComponent(c.slug)}" title="${esc(c.desc || '')}"
        style="${currentCat === c.slug ? 'background:var(--accent-soft);color:var(--accent)' : ''}">${esc(c.name)} ${c.count}</a>`).join('');
  } catch {}
}

async function loadSideTags() {
  const side = document.getElementById('side-tags');
  if (!side || side.childElementCount) return;
  try {
    const { tags } = await api('/api/tags');
    side.innerHTML = tags
      .slice(0, 12)
      .map((t) => `<a class="side-tag" href="/tag/${encodeURIComponent(t.name)}">#${esc(t.name)}<i>${t.count}</i></a>`)
      .join('');
  } catch {}
}

let timer;
const qClear = document.getElementById('q-clear');
function syncClear() { qClear.hidden = qInput.value.length === 0; }
syncClear();

qClear.addEventListener('click', () => {
  qInput.value = '';
  syncClear();
  qInput.focus();
  clearTimeout(timer);
  timer = setTimeout(applyQuery, 320);
});

// 全局 / 快捷键聚焦搜索框（GitHub 风格）。输入框/文本域/可编辑区里不抢，
// 带 Ctrl/Alt/Meta 也不抢 —— 那些是浏览器和系统的快捷键。
addEventListener('keydown', (e) => {
  if (e.key !== '/' || e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  e.preventDefault();
  qInput.focus();
  qInput.select();
});

qInput.addEventListener('input', () => {
  syncClear();
  clearTimeout(timer);
  timer = setTimeout(applyQuery, 320);
});

function applyQuery() {
    const v = qInput.value.trim();
    const url = new URL(location.href);
    if (v) url.searchParams.set('q', v); else url.searchParams.delete('q');
    url.searchParams.delete('page');
    if (currentCat) {
      location.href = `/cat/${encodeURIComponent(currentCat)}${v ? '?q=' + encodeURIComponent(v) : ''}`;
    } else if (currentTag) {
      location.href = `/tag/${encodeURIComponent(currentTag)}${v ? '?q=' + encodeURIComponent(v) : ''}`;
    } else {
      history.replaceState(null, '', url);
      currentQ = v;
      page = 1;
      document.getElementById('hero-title').textContent = v ? `搜索：${v}` : (SITE.desc || '写字的地方');
      document.getElementById('hero-sub').textContent = v
        ? '标题、正文与标签关键词匹配'
        : '记录思考、代码与生活。';
      load();
    }
}

mountHeader(currentTag ? 'tag' : currentCat ? 'cat' : 'home');
loadCats();
loadSideTags();

// 文章列表与分页已经由服务端渲染好了，只有搜索要走接口
const BOOT = window.__LIST__;
if (!BOOT || currentQ) load();
</script>
</body>
</html>

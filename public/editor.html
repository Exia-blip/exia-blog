<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>写作</title>
<meta name="robots" content="noindex,nofollow">
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m);if(t!=='paper'&&t!=='anzhiyu')document.write('<link rel="stylesheet" href="/theme/'+t+'.css">')})();</script>
<link rel="stylesheet" href="/style.css">
<script src="/boot.js" defer></script>
</head>
<body class="editor-page">

<div class="editor-top">
  <a class="btn sm" href="/" title="返回首页">←</a>
  <input class="title-input" id="title" placeholder="无标题" autocomplete="off">
  <span class="save-state" id="state"><span class="pulse"></span><span id="state-text">已同步</span></span>
  <button class="theme-btn" data-theme-btn type="button" aria-label="切换风格" aria-expanded="false" title="切换风格">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a9 9 0 1 0 0 18 2.2 2.2 0 0 0 1.7-3.6 2.2 2.2 0 0 1 1.7-3.6H18A3 3 0 0 0 21 10.8 9 9 0 0 0 12 3Z"/>
      <circle cx="8" cy="9.2" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="12.4" cy="7" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="16.4" cy="9.4" r="1.1" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button class="btn sm side-toggle" id="btn-side" title="文章与站点设置">设置</button>
  <button class="btn sm" id="btn-new" title="新建文章">新建</button>
  <button class="btn primary sm" id="btn-save">保存</button>
</div>

<div class="editor-body">
  <div class="pane left">
    <textarea id="md-input" placeholder="开始写作…&#10;&#10;支持 Markdown。拖拽或粘贴图片可直接上传。&#10;写 #标签 会自动归类。"></textarea>
  </div>
  <div class="pane">
    <div class="preview md" id="preview"></div>
  </div>
  <aside class="editor-side">
    <div class="side-sec">文章信息</div>
    <div class="field">
      <label>别名（访问路径）</label>
      <input type="text" id="slug" placeholder="如 about → /about" autocomplete="off">
      <span class="tiny muted" id="slug-hint"></span>
    </div>

    <div class="field">
      <label>栏目 <span class="tiny muted">每篇必选其一</span></label>
      <select id="category"><option value="">未分类</option></select>
      <span class="tiny muted" id="cat-hint">栏目回答「这是什么类型的东西」，标签回答「用什么做的 / 拆的是什么」</span>
    </div>

    <div class="field">
      <label>系列（可选）</label>
      <input type="text" id="series" list="series-options" placeholder="如 自建博客实录" maxlength="40" autocomplete="off">
      <datalist id="series-options"></datalist>
      <div style="display:flex;gap:8px;align-items:center;margin:2px 0 2px">
        <input type="number" id="series-order" min="1" max="999" placeholder="1" inputmode="numeric"
               style="flex:0 0 74px" aria-label="系列序号">
        <span class="tiny muted">第几篇</span>
      </div>
      <span class="tiny muted">同系列自动生成目录与上下篇互链</span>
    </div>

    <div class="field">
      <label>AI 摘要 <span class="tiny muted" id="sum-state"></span></label>
      <textarea id="summary" rows="4" maxlength="400" placeholder="保存后自动生成，也可以自己改写"></textarea>
      <div style="display:flex;gap:6px">
        <button class="btn sm" id="btn-sum" style="flex:1;justify-content:center">重新生成</button>
        <button class="btn sm" id="btn-sum-clear" title="清空，下次保存时重新生成">清空</button>
      </div>
    </div>

    <div class="field">
      <label>发布设置</label>
      <label class="switch"><input type="checkbox" id="is_private"> 私密（仅自己可见，未登录 404）</label>
      <label class="switch"><input type="checkbox" id="hidden"> 不列入首页（链接仍可直达）</label>
      <span class="tiny muted" id="pub-state"></span>
    </div>

    <div class="field">
      <label>自动标签 <span class="tiny muted" id="tag-count"></span></label>
      <div class="tagbar" id="tags" style="margin:0"></div>
      <datalist id="tag-options"></datalist>
    </div>

    <div class="field">
      <label>发布自检 <span class="tiny muted">按栏目/标签/标题规范</span></label>
      <ul class="checklist" id="checks"></ul>
    </div>

    <div class="field" style="margin-top:4px">
      <label>我的文章</label>
      <div class="cat-list" id="cat-list"></div>
    </div>

    <div class="side-sec" id="site-sec" style="display:none">站点</div>

    <details class="site-box" id="site-box" style="display:none">
      <summary>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 21 10.1H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
        </svg>
        站点设置
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </summary>
      <div class="site-body">
        <div class="field">
          <label>站点名称</label>
          <input type="text" id="site-name" placeholder="例如 Exia Blog" maxlength="60" autocomplete="off">
          <small class="site-hint">显示在浏览器标签页标题和导航栏左侧</small>
        </div>
        <div class="field">
          <label>站点描述</label>
          <textarea id="site-desc" maxlength="200" rows="3" placeholder="一句话介绍这个站点"></textarea>
          <small class="site-hint">显示在导航栏站名右侧，窄屏自动隐藏；同时作为首页的搜索引擎描述</small>
        </div>
        <div class="field">
          <label>站点头像（显示在导航栏左上角）</label>
          <div class="ava-row">
            <div class="ava-drop" id="ava-drop" title="点这里选图，也可以把图片拖进来或直接粘贴">
              <img id="ava-img" alt="" hidden>
              <span id="ava-ph">＋</span>
              <input type="file" id="ava-file" accept="image/*" hidden>
            </div>
            <div class="ava-note">
              点框选图 / 拖进来 / 粘贴
              <small>也可以直接填图片地址</small>
            </div>
          </div>
          <input type="text" id="site-avatar" placeholder="https://… 或 /img/…" maxlength="500" autocomplete="off" spellcheck="false">
          <div class="ava-btns">
            <button type="button" class="btn sm" id="btn-ava-upload">上传图片</button>
            <button type="button" class="btn sm" id="btn-ava-clear">清除</button>
          </div>
        </div>
        <div class="field">
          <label>默认风格（首次访问的读者）</label>
          <select id="site-theme"></select>
        </div>
        <div class="field">
          <label>默认外观</label>
          <select id="site-mode">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <button class="btn sm primary side-save" id="btn-site-save">保存站点信息</button>
      </div>
    </details>

    <div class="side-foot">
      <a class="btn sm side-view" id="btn-view" href="#" target="_blank">预览</a>
      <button class="btn sm danger" id="btn-del">删除</button>
    </div>
  </aside>
</div>

<div class="side-mask" id="side-mask"></div>

<div class="drop-hint" id="drop-hint">松开上传图片</div>

<script type="module">
import { api, esc, toast, fmtDate, me, bindCopyButtons } from '/app.js';
import { renderMarkdown, extractTags, extractCover } from '/md.js';
import { THEMES, initSwitcher } from '/theme.js';

initSwitcher();
bindCopyButtons(document.getElementById('preview'));

const $ = (id) => document.getElementById(id);

/* 窄屏：设置侧栏收成抽屉，顶部「设置」按钮开合 */
(function initSideDrawer() {
  const side = document.querySelector('.editor-side');
  const mask = $('side-mask');
  const btn = $('btn-side');
  if (!side || !mask || !btn) return;
  const setOpen = (open) => {
    side.classList.toggle('open', open);
    mask.classList.toggle('on', open);
  };
  btn.addEventListener('click', () => setOpen(!side.classList.contains('open')));
  mask.addEventListener('click', () => setOpen(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setOpen(false);
  });
})();
const titleEl = $('title');
const inputEl = $('md-input');
const previewEl = $('preview');
const slugEl = $('slug');
const catEl = $('category');
const seriesEl = $('series');
const seriesEl2 = $('series-order');
const privateEl = $('is_private');
const hiddenEl = $('hidden');
const stateEl = $('state');
const stateText = $('state-text');
const sumEl = $('summary');
const sumStateEl = $('sum-state');

let postId = null;      // 服务端 id
let currentSlug = '';
let dirty = false;
let rev = 0;            // 每次输入 +1：用来判断一次保存的响应是否已经过期
let saving = false;
let saveTimer = null;
let draftKey = 'draft:new';
let hasServerRecord = false;
// 站点头像预览：声明要在 boot 之前，否则 initSiteSettings 早于赋值语句执行会踩 TDZ
let paintAvatar = () => {};
let sumTouched = false; // 手动改过摘要就不让 AI 覆盖
// 发布时间：首次公开时由服务端定下，之后改标题、来回存草稿都不变
let pubAt = '';

function setPubState(v) {
  pubAt = v || '';
  const el = $('pub-state');
  if (!el) return;
  el.textContent = pubAt
    ? `发布时间 ${String(pubAt).slice(0, 10)}（不再改动）`
    : '草稿 · 首次取消「私密」时定发布时间';
}
let sumBusy = false;
// 栏目/标签规范（/api/taxonomy）：栏目四选一，标签白名单 + 别名表
let TAX = { categories: [], seed: [] };
let wantedCat = '';     // 选项还没加载完时先记下要选哪个栏目

/* ---------- 状态提示 ---------- */
function setState(kind, text) {
  stateEl.className = 'save-state ' + kind;
  stateText.textContent = text;
}

/* ---------- 本地草稿 ---------- */
function snapshot() {
  return {
    id: postId,
    title: titleEl.value,
    content: inputEl.value,
    slug: slugEl.value,
    category: catEl.value,
    series: seriesEl.value,
    series_order: seriesEl2.value,
    is_private: privateEl.checked,
    hidden: hiddenEl.checked,
    at: Date.now(),
  };
}

function saveLocal() {
  try {
    localStorage.setItem(draftKey, JSON.stringify(snapshot()));
  } catch {}
}

function readLocal(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || 'null');
  } catch {
    return null;
  }
}

function applyDraft(d) {
  if (!d) return;
  titleEl.value = d.title || '';
  inputEl.value = d.content || '';
  slugEl.value = d.slug || '';
  setCategory(d.category || '');
  seriesEl.value = d.series || '';
  seriesEl2.value = d.series_order || '';
  privateEl.checked = !!d.is_private;
  hiddenEl.checked = !!d.hidden;
}

/* ---------- 预览 ---------- */
let previewTimer = null;
function updatePreview() {
  const md = inputEl.value;
  previewEl.innerHTML = renderMarkdown(md);
  renderTagPreview(md);
  updateChecks();
  document.querySelectorAll('.copy-btn').forEach((b) => (b.onclick = null));
}

function renderTagPreview(md) {
  const tags = extractTags(md).map((t) => t.toLowerCase());
  const seed = new Set((TAX.seed || []).map((t) => t.toLowerCase()));
  $('tag-count').textContent = tags.length ? `${tags.length} 个（规则 1~4）` : '';
  $('tags').innerHTML = tags.length
    ? tags
        .map(
          (t) =>
            `<span class="tag${seed.size && !seed.has(t) ? ' off' : ''}" title="${
              seed.has(t) ? '白名单内' : '不在白名单：确认这是技术名词，或换成已有标签'
            }">#${esc(t)}</span>`
        )
        .join('')
    : '<span class="tiny muted">正文里写 #标签 自动识别</span>';
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 60);
}

/* ---------- 保存到服务端 ---------- */
async function saveNow(manual = false) {
  clearTimeout(saveTimer);              // 手动保存时把排队中的定时器收掉
  // 正在存又有新改动：别直接吞掉，重新排一次队，否则这次改动要等下一个按键才会上云
  if (saving) { scheduleSave(); return; }
  if (!dirty && !manual) return;
  saving = true;
  const myRev = rev;
  setState('saving', '保存中…');

  const payload = {
    title: titleEl.value.trim() || '无标题',
    content: inputEl.value,
    slug: slugEl.value.trim(),
    category: catEl.value.trim(),
    series: seriesEl.value.trim(),
    series_order: parseInt(seriesEl2.value, 10) || 0,
    is_private: privateEl.checked,
    hidden: hiddenEl.checked,
  };
  // 只有手动改过摘要才回传，否则交给服务端按正文变化自动生成
  if (sumTouched) payload.summary = sumEl.value.trim();

  try {
    let res;
    if (postId) {
      res = await api('/api/posts/' + postId, { method: 'PUT', body: payload });
    } else {
      res = await api('/api/posts', { method: 'POST', body: payload });
      postId = res.id;
      // 迁移本地草稿 key，避免新建后丢失
      const old = draftKey;
      draftKey = 'draft:' + postId;
      const d = readLocal(old);
      if (d) {
        localStorage.setItem(draftKey, JSON.stringify({ ...d, id: postId }));
        localStorage.removeItem(old);
      }
      history.replaceState(null, '', '/editor?id=' + postId);
      hasServerRecord = true;
    }

    // 发布时间以服务端落库值为准，前端不猜：草稿存回来是空串，首次公开才会变成时间
    if (res && res.published_at !== undefined) setPubState(res.published_at);

    currentSlug = res.slug || currentSlug;
    slugEl.placeholder = currentSlug ? `/${currentSlug}` : '如 about → /about';
    $('btn-view').href = '/p/' + encodeURIComponent(currentSlug || '');

    if (sumTouched && !sumEl.value.trim()) sumTouched = false;  // 用户清空了 → 让 AI 重写
    // 响应回来时比对版本号：中间又敲过字就不能清 dirty，否则最后几个字永远进不了云端
    if (rev === myRev) {
      dirty = false;
    } else {
      scheduleSave();      // 这份响应已过期，重新排队
    }
    saveLocal();
    setState('', '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
    if (manual) toast('已保存');
    loadList();
    if (!sumTouched && postId) fetchSummary(false);   // 后台补摘要，不挡保存
  } catch (e) {
    setState('error', e.message || '保存失败');
    toast(e.message || '保存失败');
  } finally {
    saving = false;
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setState('', '编辑中…');
  saveTimer = setTimeout(() => saveNow(false), 3000);
}

/* ---------- AI 摘要 ---------- */
function setSumState(text) {
  sumStateEl.textContent = text || '';
}

async function fetchSummary(force = false) {
  if (!postId || sumBusy || sumTouched) return;
  if (!inputEl.value.trim()) {
    setSumState('');
    return;
  }
  sumBusy = true;
  const btn = $('btn-sum');
  btn.disabled = true;
  setSumState(force ? '重新生成中…' : '生成中…');
  try {
    const r = await api('/api/posts/' + postId + '/summary', {
      method: 'POST',
      body: { title: titleEl.value.trim() || '无标题', content: inputEl.value, force },
    });
    if (!sumTouched) sumEl.value = r.summary || '';
    setSumState(r.cached ? '已是最新' : r.src === 'ai' ? '刚生成' : '已生成（无模型，按正文截取）');
  } catch (e) {
    setSumState('生成失败：' + (e.message || '未知错误'));
  } finally {
    sumBusy = false;
    btn.disabled = false;
  }
}

sumEl.addEventListener('input', () => {
  sumTouched = true;
  setSumState('手动改写，保存后生效');
});

$('btn-sum').onclick = () => {
  if (!postId) return toast('先保存一次，再生成摘要');
  sumTouched = false;
  fetchSummary(true);
};

$('btn-sum-clear').onclick = () => {
  sumEl.value = '';
  sumTouched = true;
  setSumState('已清空，保存后重新生成');
};

/* ---------- 输入绑定 ---------- */
function onInput() {
  dirty = true;
  rev++;
  saveLocal();          // 每次输入即写 localStorage
  schedulePreview();
  scheduleSave();       // 停顿 3 秒落库
}

titleEl.addEventListener('input', onInput);
inputEl.addEventListener('input', onInput);
[slugEl, privateEl, hiddenEl].forEach((el) => el.addEventListener('change', onInput));
catEl.addEventListener('change', () => {
  updateCatHint();
  updateChecks();
  onInput();
});
sumEl.addEventListener('input', updateChecks);

// Tab 插入缩进
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = inputEl.selectionStart;
    inputEl.setRangeText('  ', s, inputEl.selectionEnd, 'end');
    onInput();
  }
});

// Ctrl/Cmd + S
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveNow(true);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    saveNow(true);
  }
});

// 离开前提醒
window.addEventListener('beforeunload', (e) => {
  saveLocal();
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ---------- 图片上传：拖拽 / 粘贴 ---------- */

/* 上传前在浏览器里转 WebP：省的是访客流量，也省 Worker 出口。
   长边 1600 对正文插图足够（正文栏 720px，2 倍屏也不过 1440）；
   GIF / SVG 不碰 —— 一个丢动画，一个是矢量，转了反而糟。 */
async function toWebp(file, maxSide = 1600, quality = 0.82) {
  if (!/^image\/(jpeg|png)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    if (scale === 1 && file.size < 200 * 1024) return file; // 本来就小，不折腾
    const cv = document.createElement('canvas');
    cv.width = w;
    cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise((ok) => cv.toBlob(ok, 'image/webp', quality));
    // 省不到 8% 就不换格式：有些图（已经压过的截图）转完反而更大
    if (!blob || blob.size >= file.size * 0.92) return file;
    const name = String(file.name || 'image').replace(/\.[^.]+$/, '') + '.webp';
    return new File([blob], name, { type: 'image/webp' });
  } catch {
    return file; // 老浏览器没有 createImageBitmap，退回原图，别把上传搞挂
  }
}

async function uploadFile(file) {
  if (!file || !file.type.startsWith('image/')) return null;
  if (file.size > 12 * 1024 * 1024) {
    toast('图片超过 12MB');
    return null;
  }
  file = await toWebp(file);

  toast('上传中…', 8000);
  try {
    const r = await api('/api/upload-url', {
      method: 'POST',
      body: { name: file.name || 'pasted.png', type: file.type },
    });

    if (r.mode === 'direct') {
      try {
        const put = await fetch(r.uploadUrl, {
          method: 'PUT',
          headers: { 'content-type': file.type },
          body: file,
        });
        if (!put.ok) throw new Error('R2 直传失败 ' + put.status);
      } catch (err) {
        // 直传失败（多半是 R2 CORS 没配）时回退到 Worker 中转
        const fd = new FormData();
        fd.append('file', file);
        const r2 = await api('/api/upload', { method: 'POST', body: fd });
        r.publicUrl = r2.publicUrl;
      }
    } else {
      const fd = new FormData();
      fd.append('file', file);
      const r2 = await api('/api/upload', { method: 'POST', body: fd });
      r.publicUrl = r2.publicUrl;
    }

    insertAtCursor(`\n![${file.name || 'image'}](${r.publicUrl})\n`);
    toast('图片已插入');
    return r.publicUrl;
  } catch (e) {
    toast('上传失败：' + e.message);
    return null;
  }
}

function insertAtCursor(text) {
  const s = inputEl.selectionStart;
  const e = inputEl.selectionEnd;
  inputEl.setRangeText(text, s, e, 'end');
  inputEl.focus();
  onInput();
}

inputEl.addEventListener('paste', async (e) => {
  const items = [...(e.clipboardData?.items || [])];
  const img = items.find((i) => i.type.startsWith('image/'));
  if (img) {
    e.preventDefault();
    await uploadFile(img.getAsFile());
  }
});

const dropHint = $('drop-hint');
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  if ([...(e.dataTransfer?.types || [])].includes('Files')) {
    dragDepth++;
    dropHint.classList.add('on');
  }
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; dropHint.classList.remove('on'); }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropHint.classList.remove('on');
  const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith('image/'));
  for (const f of files) await uploadFile(f);
});

/* ---------- 文章列表 ---------- */
let allPosts = [];
async function loadList() {
  try {
    const { posts } = await api('/api/mine');
    allPosts = posts;
    $('cat-list').innerHTML = posts.length
      ? posts.map((p) => `
        <div class="cat-item ${p.id === postId ? 'active' : ''}" data-id="${p.id}" data-slug="${esc(p.slug)}">
          <span class="t">${esc(p.title)}</span>
          ${p.is_private ? '<span class="flag">私</span>' : p.hidden ? '<span class="flag">隐</span>' : ''}
        </div>`).join('')
      : '<span class="tiny muted">还没有文章</span>';
  } catch {}
}

$('cat-list').addEventListener('click', (e) => {
  const item = e.target.closest('[data-id]');
  if (!item) return;
  if (dirty && !confirm('当前有未保存的改动，确定切换？')) return;
  location.href = '/editor?id=' + item.dataset.id;
});

/* ---------- 载入 ---------- */
function resetEditor() {
  postId = null;
  currentSlug = '';
  draftKey = 'draft:new';
  titleEl.value = '';
  inputEl.value = '';
  slugEl.value = '';
  setCategory('');
  seriesEl.value = '';
  seriesEl2.value = '';
  privateEl.checked = false;
  hiddenEl.checked = false;
  setPubState('');
  sumEl.value = '';
  sumTouched = false;
  setSumState('');
  $('btn-view').href = '#';
  dirty = false;
  setState('', '新文章');
  updatePreview();
  history.replaceState(null, '', '/editor');
}

$('btn-new').onclick = () => {
  if (dirty && !confirm('当前有未保存的改动，确定新建？')) return;
  resetEditor();
  loadList();
  titleEl.focus();
};

$('btn-save').onclick = () => saveNow(true);

$('btn-del').onclick = async () => {
  if (!postId) return toast('还没保存，无需删除');
  if (!confirm('删除这篇文章？不可恢复。')) return;
  try {
    await api('/api/posts/' + postId, { method: 'DELETE' });
    localStorage.removeItem('draft:' + postId);
    toast('已删除');
    dirty = false;
    resetEditor();
    loadList();
  } catch (e) {
    toast(e.message);
  }
};

// 切到后台时先把本地草稿写死
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) saveLocal();
});

const user = await me();
if (user && user.is_admin) initSiteSettings();
if (!user) {
  location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
} else {
  const idParam = new URLSearchParams(location.search).get('id');

  if (idParam && /^\d+$/.test(idParam)) {
    postId = parseInt(idParam, 10);
    draftKey = 'draft:' + postId;
    hasServerRecord = true;

    try {
      const { posts } = await api('/api/mine');
      const p = posts.find((x) => x.id === postId);
      if (!p) throw new Error('文章不存在');

      titleEl.value = p.title;
      inputEl.value = p.content;
      slugEl.value = p.slug;
      setCategory(p.category || '');
      seriesEl.value = p.series || '';
      seriesEl2.value = p.series_order ? String(p.series_order) : '';
      privateEl.checked = !!p.is_private;
      hiddenEl.checked = !!p.hidden;
      // 用落库原值：private 草稿的 published_at 在接口里会退回 created_at，那是展示兜底
      setPubState(p.published_at_raw ?? p.published_at ?? '');
      sumEl.value = p.summary || '';
      sumTouched = false;
      setSumState(p.summary ? (p.summary_src === 'manual' ? '手动' : '') : '');
      currentSlug = p.slug;
      $('btn-view').href = '/p/' + encodeURIComponent(p.slug);
      slugEl.placeholder = `/${p.slug}`;

      // 本地草稿比服务器新 → 恢复本地
      const d = readLocal(draftKey);
      const serverTime = new Date(String(p.updated_at).replace(' ', 'T') + 'Z').getTime();
      if (d && d.at > serverTime + 1000 && (d.title !== p.title || d.content !== p.content)) {
        applyDraft(d);
        dirty = true;
        setState('', '已恢复本地草稿');
        toast('已恢复未同步的本地草稿');
      } else {
        setState('', '已同步');
      }
    } catch (e) {
      toast(e.message);
      resetEditor();
    }
  } else {
    // 新建：若有未保存的本地草稿则恢复
    const d = readLocal('draft:new');
    if (d && (d.title || d.content)) {
      applyDraft(d);
      dirty = true;
      setState('', '已恢复本地草稿');
    } else {
      setState('', '新文章');
    }
  }

  updatePreview();
  loadList();
  loadTaxonomy();
  inputEl.focus();
}

/* 栏目选项 + 标签白名单：都从服务端同一份规范来，前后台不会走偏 */
async function loadTaxonomy() {
  try {
    TAX = await api('/api/taxonomy');
    catEl.innerHTML =
      '<option value="">未分类</option>' +
      TAX.categories.map((c) => `<option value="${c.slug}">${esc(c.name)} — ${esc(c.hint || '')}</option>`).join('');
    // 老文章里可能是中文栏目名，原样留着回传，别在页面上被悄悄改成「未分类」
    if (wantedCat && !TAX.categories.some((c) => c.slug === wantedCat)) {
      const o = document.createElement('option');
      o.value = wantedCat;
      o.textContent = `${wantedCat}（旧栏目名）`;
      catEl.appendChild(o);
    }
    catEl.value = wantedCat;
    $('tag-options').innerHTML = (TAX.seed || []).map((t) => `<option value="${esc(t)}">`).join('');
    updateCatHint();
    renderTagPreview(inputEl.value);
    updateChecks();
    loadSeriesOptions();
  } catch {}
}

/* 已有系列塞进 datalist：连载不靠记忆，避免「自建博客实录」和「自建博客实录 」变成两个系列 */
async function loadSeriesOptions() {
  try {
    const { series } = await api('/api/series');
    $('series-options').innerHTML = (series || [])
      .map((x) => `<option value="${esc(x.name)}">${x.count} 篇</option>`)
      .join('');
  } catch {}
}

function setCategory(v) {
  wantedCat = v || '';
  catEl.value = wantedCat;
}

function updateCatHint() {
  const c = (TAX.categories || []).find((x) => x.slug === catEl.value);
  $('cat-hint').textContent = c
    ? c.desc
    : '栏目回答「这是什么类型的东西」，标签回答「用什么做的 / 拆的是什么」';
}

/* 发布自检：把《栏目与标题写作体系》里那几条规则做成看得见的勾 */
function updateChecks() {
  const el = $('checks');
  if (!el) return;
  const title = titleEl.value.trim();
  const md = inputEl.value;
  const tags = extractTags(md).map((t) => t.toLowerCase());
  const cat = catEl.value;
  const cname = (TAX.categories || []).find((x) => x.slug === cat)?.name || '';
  const sum = sumEl.value.trim();
  const bodyLen = md.replace(/```[\s\S]*?```/g, '').replace(/\s/g, '').length;

  const rows = [
    [title.length >= 8, title ? `标题 ${title.length} 字${title.length >= 8 ? '' : '，太短'}` : '还没写标题'],
    [/[A-Za-z0-9]/.test(title), '标题含技术名 / 报错原文'],
    [!!cat, cat ? `栏目：${cname}` : '还没选栏目'],
    [tags.length >= 1 && tags.length <= 4, `标签 ${tags.length} 个（1~4）`],
    [sum.length >= 20, sum ? `摘要 ${sum.length} 字` : '摘要为空，先写结论'],
    [bodyLen >= 200, `正文 ${bodyLen} 字`],
    // 缩略图不用作者操心，但让他知道发出来长什么样
    [true, extractCover(md) ? '缩略图：取正文第一张图' : '缩略图：正文无图，自动轮换预设图'],
  ];
  el.innerHTML = rows
    .map(([ok, text]) => `<li class="${ok ? 'ok' : 'todo'}"><span class="ck">${ok ? '✓' : '!'}</span>${esc(text)}</li>`)
    .join('');
}

/* ---------- 站点头像：URL / 上传 / 拖拽 / 粘贴 ---------- */
async function uploadAvatar(file) {
  if (!file || !/^image\//.test(file.type)) { toast('请选择图片文件'); return; }
  if (file.size > 4 * 1024 * 1024) { toast('图片别超过 4MB'); return; }

  const drop = $('ava-drop');
  drop.classList.add('busy');
  try {
    // 头像最大显示 96px，2 倍屏 192px；给 512 已经是富余
    file = await toWebp(file, 512, 0.86);
    const fd = new FormData();
    fd.append('file', file);
    const r = await api('/api/settings/avatar', { method: 'POST', body: fd });
    $('site-avatar').value = r.avatar;
    paintAvatar(r.avatar);
    toast('头像已更新');
  } catch (e) {
    toast('上传失败：' + e.message);
  } finally {
    drop.classList.remove('busy');
  }
}

function initAvatarField() {
  const drop = $('ava-drop');
  const img = $('ava-img');
  const ph = $('ava-ph');
  const fileEl = $('ava-file');
  const input = $('site-avatar');
  if (!drop || !img || !input) return;

  paintAvatar = (url) => {
    url = String(url || '').trim();
    if (url) {
      img.src = url;
      img.hidden = false;
      ph.hidden = true;
    } else {
      img.removeAttribute('src');
      img.hidden = true;
      ph.hidden = false;
    }
  };
  img.addEventListener('error', () => { img.hidden = true; ph.hidden = false; });

  input.addEventListener('input', () => paintAvatar(input.value));

  drop.addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', () => {
    const f = fileEl.files && fileEl.files[0];
    if (f) uploadAvatar(f);
    fileEl.value = '';
  });

  ['dragenter', 'dragover'].forEach((ev) =>
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      // 别让页面的全局拖拽把图片插进正文
      e.stopPropagation();
      drop.classList.add('over');
      $('drop-hint').classList.remove('on');
    })
  );
  ['dragleave', 'drop'].forEach((ev) =>
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove('over');
    })
  );
  drop.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) uploadAvatar(f);
  });

  // 粘贴：只有站点设置抽屉展开、焦点在里面时才接管，别抢正文粘贴
  document.addEventListener('paste', (e) => {
    const box = $('site-box');
    if (!box || !box.open || !box.contains(document.activeElement)) return;
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (!item) return;
    const f = item.getAsFile();
    if (!f) return;
    e.preventDefault();
    uploadAvatar(f);
  });

  $('btn-ava-upload').addEventListener('click', () => fileEl.click());
  $('btn-ava-clear').addEventListener('click', () => {
    input.value = '';
    paintAvatar('');
    toast('已清除，点「保存站点信息」生效');
  });
}

/* ---------- 站点设置（仅管理员） ---------- */
async function initSiteSettings() {
  const box = $('site-box');
  if (!box) return;
  box.style.display = 'block';
  const sec = $('site-sec');
  if (sec) sec.style.display = 'flex';

  $('site-theme').innerHTML = THEMES.map((t) => `<option value="${t.id}">${t.name} · ${t.desc}</option>`).join('');
  initAvatarField();

  try {
    const s = await api('/api/settings');
    $('site-name').value = s.name || '';
    $('site-desc').value = s.desc || '';
    $('site-theme').value = s.theme || 'paper';
    $('site-mode').value = s.mode || 'auto';
    $('site-avatar').value = s.avatar || '';
    paintAvatar(s.avatar || '');
  } catch (e) {
    toast('站点设置读取失败：' + e.message);
  }

  $('btn-site-save').addEventListener('click', async () => {
    const btn = $('btn-site-save');
    const name = $('site-name').value.trim();
    if (!name) { toast('站点名称不能为空'); $('site-name').focus(); return; }

    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      const r = await api('/api/settings', {
        method: 'PUT',
        body: {
          name,
          desc: $('site-desc').value.trim(),
          theme: $('site-theme').value,
          mode: $('site-mode').value,
          avatar: $('site-avatar').value.trim(),
        },
      });
      $('site-name').value = r.name;
      $('site-avatar').value = r.avatar || '';
      paintAvatar(r.avatar || '');
      document.title = r.name + ' · 后台';
      toast('站点信息已更新');
    } catch (e) {
      toast(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '保存站点信息';
    }
  });
}

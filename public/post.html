<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--SEO-->
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m)})();</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap" id="page">
  <div class="empty">加载中…</div>
</main>

<script type="module">
import { api, fmtDate, fmtRelative, esc, mountHeader, toast, me, site, bindCopyButtons, bindReadingProgress } from '/app.js';

bindCopyButtons(document);

const segs = location.pathname.split('/').filter(Boolean);
const slug = decodeURIComponent(segs[0] === 'p' ? segs[1] || '' : segs[0] || '');

const page = document.getElementById('page');
// 服务端已经把正文写进 HTML 了，这里不再重复拉一遍接口
let POST = window.__POST__ || null;
let USER = null;
let replyTo = null;

/* SSR 页面只挂事件、不重建 DOM：正文不会重排，滚动位置也不会跳 */
function hydrate() {
  const p = POST;
  const slot = document.querySelector('.post-edit');
  if (slot && USER && (USER.is_admin || USER.id === p.author_id)) {
    slot.innerHTML = `<a class="btn sm" href="/editor?id=${p.id}">编辑</a>`;
  }
  bindReply();
  bindForm();
  bindReadingProgress(document.querySelector('.post-body'));
}

/* 正文模板只在 Worker 里有一份（src/index.js servePostPage）。
   这里以前还留着一套前端模板兜底，改一处忘一处就对不上，SSR 稳定后删掉了。 */
function fallbackNotice() {
  page.innerHTML =
    '<div class="empty">正文没取到，可能是页面缓存过期了。<a href="javascript:location.reload()">刷新一下</a></div>';
}

/* ---------- 评论 ---------- */
async function loadComments() {
  const box = document.getElementById('cmt-list');
  if (!box) return;
  try {
    const { comments, total } = await api('/api/comments?slug=' + encodeURIComponent(slug));
    document.getElementById('cmt-count').textContent = total ? `(${total})` : '';
    if (!comments.length) {
      box.innerHTML = '<div class="muted small" style="padding:14px 0">还没有评论，来抢沙发。</div>';
      return;
    }
    box.innerHTML = comments.map(renderCmt).join('');
  } catch (e) {
    box.innerHTML = `<div class="muted small">评论加载失败</div>`;
  }
}

function avatarText(name) {
  return esc(String(name || '?').slice(0, 1).toUpperCase());
}

function renderCmt(c, isChild = false) {
  const del = USER && USER.is_admin
    ? `<button data-del="${c.id}">删除</button>` : '';
  const reply = !isChild ? `<button data-reply="${c.id}" data-name="${esc(c.name)}">回复</button>` : '';
  const homepage = c.website
    ? `<a href="${esc(c.website)}" target="_blank" rel="noopener nofollow" class="muted">${esc(c.name)}</a>`
    : esc(c.name);

  return `
  <div class="cmt" data-cid="${c.id}">
    <div class="ava">${avatarText(c.name)}</div>
    <div class="main">
      <div class="head">
        <b>${homepage}</b>
        ${c.is_admin ? '<span class="badge-owner">博主</span>' : ''}
        <span class="when">${fmtRelative(c.created_at)}</span>
        ${USER && USER.is_admin && c.email
          ? `<a class="cmt-mail" href="mailto:${esc(c.email)}" title="联系邮箱，仅管理员可见">${esc(c.email)}</a>`
          : ''}
      </div>
      <div class="text">${esc(c.content)}</div>
      <div class="acts">${reply}${del}</div>
      ${c.replies && c.replies.length ? `<div class="replies">${c.replies.map((r) => renderCmt(r, true)).join('')}</div>` : ''}
    </div>
  </div>`;
}

function bindReply() {
  const box = document.getElementById('cmt-list');
  if (!box) return;
  box.addEventListener('click', async (e) => {
    const r = e.target.closest('[data-reply]');
    if (r) {
      replyTo = { id: +r.dataset.reply, name: r.dataset.name };
      const hint = document.getElementById('reply-hint');
      hint.style.display = 'block';
      hint.innerHTML = `回复 <b>${esc(replyTo.name)}</b> · <a href="javascript:;" id="cancel-reply">取消</a>`;
      document.getElementById('cancel-reply').onclick = () => {
        replyTo = null;
        hint.style.display = 'none';
      };
      document.querySelector('#cmt-form textarea').focus();
      return;
    }
    const d = e.target.closest('[data-del]');
    if (d) {
      if (!confirm('删除这条评论？其下的回复也会一并删除。')) return;
      try {
        await api('/api/comments/' + d.dataset.del, { method: 'DELETE' });
        toast('已删除');
        loadComments();
      } catch (err) { toast(err.message); }
    }
  });
}

function bindForm() {
  const form = document.getElementById('cmt-form');
  // 注意：form.name 是 <form> 自身的 name 属性，不是叫 name 的输入框，
  // 必须走 form.elements 取字段，否则拿到的是空字符串。
  const f = form.elements;
  const field = (n) => f.namedItem(n);

  if (USER) {
    // 登录用户：昵称锁定成账号名，邮箱预填账号邮箱（可改，用于联系）
    const nameEl = field('name');
    nameEl.value = USER.name || USER.login || '';
    nameEl.readOnly = true;
    nameEl.title = '登录账号的昵称，无需填写';
  }

  // 记住游客信息 / 预填邮箱
  try {
    const saved = JSON.parse(localStorage.getItem('cmt:guest') || '{}');
    if (!USER) {
      if (saved.name) field('name').value = saved.name;
      if (saved.email) field('email').value = saved.email;
      if (saved.website) field('website').value = saved.website;
    } else {
      field('email').value = USER.email || saved.email || '';
      if (saved.website) field('website').value = saved.website;
    }
  } catch {}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = field('content').value.trim();
    const name = field('name').value.trim();
    const email = field('email').value.trim();
    const website = field('website').value.trim();

    if (!content) { toast('说点什么吧'); field('content').focus(); return; }
    if (!name) { toast('请先填昵称'); field('name').focus(); return; }
    if (!email) { toast('请填写联系邮箱'); field('email').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('邮箱格式不正确'); field('email').focus(); return; }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = '发送中…';

    try {
      await api('/api/comments', {
        method: 'POST',
        body: {
          slug,
          content,
          parent_id: replyTo?.id || null,
          name,
          email,
          website,
        },
      });
      localStorage.setItem('cmt:guest', JSON.stringify({ name: USER ? '' : name, email, website }));
      field('content').value = '';
      replyTo = null;
      document.getElementById('reply-hint').style.display = 'none';
      toast('评论已发布');
      loadComments();
    } catch (err) {
      toast(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '发表评论';
    }
  });
}

USER = await mountHeader();
if (POST) {
  hydrate();
  loadComments();
} else {
  fallbackNotice();
}
</script>
</body>
</html>

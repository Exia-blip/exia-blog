<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--SEO-->
<!--THEME-->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('x_theme');m=localStorage.getItem('x_mode')}catch(e){}var g=window.__THEME_DEFAULT__||{};t=t||g.theme||'paper';m=m||g.mode||'auto';var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;var dark=(m==='dark')||(m!=='light'&&sys);d.setAttribute('data-theme',t);d.setAttribute('data-mode',dark?'dark':'light');d.setAttribute('data-mpref',m)})();</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="site-header" data-site="Exia Blog"></div>

<main class="wrap" id="page">
  <div class="empty">加载中…</div>
</main>

<script type="module">
import { api, fmtDate, fmtRelative, esc, mountHeader, toast, me, site, bindCopyButtons, bindReadingProgress } from '/app.js';
import { bindCopyNotice } from '/copy-notice.js';

bindCopyButtons(document);
// 复制正文自动附署名。只挂在文章页 —— 首页复制卡片摘要不需要这段
bindCopyNotice();

const segs = location.pathname.split('/').filter(Boolean);
const slug = decodeURIComponent(segs[0] === 'p' ? segs[1] || '' : segs[0] || '');

const page = document.getElementById('page');
// 服务端已经把正文写进 HTML 了，这里不再重复拉一遍接口
let POST = window.__POST__ || null;
let USER = null;
let replyTo = null;

/* SSR 页面只挂事件、不重建 DOM：正文不会重排，滚动位置也不会跳 */
function hydrate() {
  const p = POST;
  const slot = document.querySelector('.post-edit');
  if (slot && USER && (USER.is_admin || USER.id === p.author_id)) {
    slot.innerHTML = `<a class="btn sm" href="/editor?id=${p.id}">编辑</a>`;
  }
  bindReply();
  bindForm();
  mountTurnstile();
  bindReadingProgress(document.querySelector('.post-body'));
}

/* 正文模板只在 Worker 里有一份（src/index.js servePostPage）。
   这里以前还留着一套前端模板兜底，改一处忘一处就对不上，SSR 稳定后删掉了。 */
function fallbackNotice() {
  page.innerHTML =
    '<div class="empty">正文没取到，可能是页面缓存过期了。<a href="javascript:location.reload()">刷新一下</a></div>';
}

/* ---------- 评论 ---------- */
async function loadComments() {
  const box = document.getElementById('cmt-list');
  if (!box) return;
  try {
    const { comments, total } = await api('/api/comments?slug=' + encodeURIComponent(slug));
    document.getElementById('cmt-count').textContent = total ? `(${total})` : '';
    if (!comments.length) {
      box.innerHTML = '<div class="muted small" style="padding:14px 0">还没有评论，来抢沙发。</div>';
      return;
    }
    box.innerHTML = comments.map(renderCmt).join('');
  } catch (e) {
    box.innerHTML = `<div class="muted small">评论加载失败</div>`;
  }
}

function avatarText(name) {
  return esc(String(name || '?').slice(0, 1).toUpperCase());
}

function renderCmt(c, isChild = false) {
  const del = USER && USER.is_admin
    ? `<button data-del="${c.id}">删除</button><button data-ban="${c.id}" class="cmt-ban" title="删掉这个来源的全部访客评论，并拉黑该 IP">封 IP</button>`
    : '';
  const reply = !isChild ? `<button data-reply="${c.id}" data-name="${esc(c.name)}">回复</button>` : '';
  const homepage = c.website
    ? `<a href="${esc(c.website)}" target="_blank" rel="noopener nofollow" class="muted">${esc(c.name)}</a>`
    : esc(c.name);

  return `
  <div class="cmt" data-cid="${c.id}">
    <div class="ava">${avatarText(c.name)}</div>
    <div class="main">
      <div class="head">
        <b>${homepage}</b>
        ${c.is_admin ? '<span class="badge-owner">博主</span>' : ''}
        <span class="when">${fmtRelative(c.created_at)}</span>
        ${USER && USER.is_admin && c.email
          ? `<a class="cmt-mail" href="mailto:${esc(c.email)}" title="联系邮箱，仅管理员可见">${esc(c.email)}</a>`
          : ''}
      </div>
      <div class="text">${esc(c.content)}</div>
      <div class="acts">${reply}${del}</div>
      ${c.replies && c.replies.length ? `<div class="replies">${c.replies.map((r) => renderCmt(r, true)).join('')}</div>` : ''}
    </div>
  </div>`;
}

function bindReply() {
  const box = document.getElementById('cmt-list');
  if (!box) return;
  box.addEventListener('click', async (e) => {
    const r = e.target.closest('[data-reply]');
    if (r) {
      replyTo = { id: +r.dataset.reply, name: r.dataset.name };
      const hint = document.getElementById('reply-hint');
      hint.style.display = 'block';
      hint.innerHTML = `回复 <b>${esc(replyTo.name)}</b> · <a href="javascript:;" id="cancel-reply">取消</a>`;
      document.getElementById('cancel-reply').onclick = () => {
        replyTo = null;
        hint.style.display = 'none';
      };
      document.querySelector('#cmt-form textarea').focus();
      return;
    }
    const b = e.target.closest('[data-ban]');
    if (b) {
      if (!confirm('把这个 IP 的访客评论全部删除，并拉黑该地址？')) return;
      try {
        const r = await api('/api/comments/ban', { method: 'POST', body: { id: +b.dataset.ban } });
        toast(`已删除 ${r.removed} 条，IP 已拉黑`);
        loadComments();
      } catch (err) { toast(err.message); }
      return;
    }
    const d = e.target.closest('[data-del]');
    if (d) {
      if (!confirm('删除这条评论？其下的回复也会一并删除。')) return;
      try {
        await api('/api/comments/' + d.dataset.del, { method: 'DELETE' });
        toast('已删除');
        loadComments();
      } catch (err) { toast(err.message); }
    }
  });
}

/* Turnstile 只在配了 site key 时才加载 —— 没配就一个第三方请求都不发 */
let tsFailed = false;   // 配了 key 但脚本没下来（断网、被拦截插件掐掉）

async function mountTurnstile() {
  const key = (window.__SITE__ || {}).turnstile;
  const slot = document.getElementById('ts-wrap');
  if (!key || !slot) return;
  slot.hidden = false;
  try {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.async = true;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    window.turnstile.render(slot, { sitekey: key, language: 'zh-cn', size: 'flexible' });
  } catch {
    // 组件没下来就别装作"请勾选"——那个框用户根本看不见，报错得说实话
    tsFailed = true;
    slot.hidden = true;
  }
}

function bindForm() {
  const form = document.getElementById('cmt-form');
  // 注意：form.name 是 <form> 自身的 name 属性，不是叫 name 的输入框，
  // 必须走 form.elements 取字段，否则拿到的是空字符串。
  const f = form.elements;
  const field = (n) => f.namedItem(n);

  if (USER) {
    // 登录用户：昵称锁定成账号名，邮箱预填账号邮箱（可改，用于联系）
    const nameEl = field('name');
    nameEl.value = USER.name || USER.login || '';
    nameEl.readOnly = true;
    nameEl.title = '登录账号的昵称，无需填写';
  }

  // 记住游客信息 / 预填邮箱
  try {
    const saved = JSON.parse(localStorage.getItem('cmt:guest') || '{}');
    if (!USER) {
      if (saved.name) field('name').value = saved.name;
      if (saved.email) field('email').value = saved.email;
      if (saved.website) field('website').value = saved.website;
    } else {
      field('email').value = USER.email || saved.email || '';
      if (saved.website) field('website').value = saved.website;
    }
  } catch {}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = field('content').value.trim();
    const name = field('name').value.trim();
    const email = field('email').value.trim();
    const website = field('website').value.trim();

    if (!content) { toast('说点什么吧'); field('content').focus(); return; }
    if (!name) { toast('请先填昵称'); field('name').focus(); return; }
    if (!email) { toast('请填写联系邮箱'); field('email').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('邮箱格式不正确'); field('email').focus(); return; }

    // Turnstile 配了才要求 token；没配时 window.turnstile 不存在，这里就是空串
    const tsToken = window.turnstile && document.getElementById('ts-wrap')?.hidden === false
      ? window.turnstile.getResponse() : '';
    if (window.__SITE__ && window.__SITE__.turnstile && !tsToken) {
      toast(tsFailed ? '人机验证组件没加载出来，刷新页面或换个网络再试' : '先完成人机验证');
      return;
    }

    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = '发送中…';

    try {
      await api('/api/comments', {
        method: 'POST',
        body: {
          slug,
          content,
          parent_id: replyTo?.id || null,
          name,
          email,
          website,
          hp: (field('hp') || {}).value || '',
          turnstile_token: tsToken,
        },
      });
      localStorage.setItem('cmt:guest', JSON.stringify({ name: USER ? '' : name, email, website }));
      field('content').value = '';
      replyTo = null;
      document.getElementById('reply-hint').style.display = 'none';
      toast('评论已发布');
      if (window.turnstile) window.turnstile.reset();
      loadComments();
    } catch (err) {
      toast(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '发表评论';
    }
  });
}


/* 目录跟随：高亮 + 进度 + 目录内部滚动，三件事共用一次 scroll 回调。
   判据是「标题顶端越过视口上沿 96px」，比 IntersectionObserver 更贴手感 ——
   IO 在长段落里会同时命中两节，还得再加一套优先级逻辑，不如直接比位置。 */
function bindTocSpy() {
  const desktop = document.querySelector('.post-toc');
  const ol = desktop && desktop.querySelector('ol');
  const all = [...document.querySelectorAll('a[data-toc]')];
  if (!all.length) return;

  const pairs = [];
  for (const a of all) {
    const el = document.getElementById(a.dataset.toc);
    if (el) pairs.push([el, a]);
  }
  if (!pairs.length) return;

  // 每个链接各自最近的滚动容器（桌面是 .toc-inner，抽屉是 .mtoc-body）
  const scrollerOf = (a) => {
    for (let n = a.parentElement; n; n = n.parentElement) {
      const st = getComputedStyle(n);
      if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;
    }
    return null;
  };

  /* 把高亮项拉进目录可视区：只动目录自己的 scrollTop，不碰页面。
     上边留 1/3、下边留 1/3 —— 让下一项也露出来，读者知道后面还有。 */
  const keepVisible = (a) => {
    const box = scrollerOf(a);
    if (!box) return;
    const br = box.getBoundingClientRect();
    const ar = a.getBoundingClientRect();
    const padTop = br.height * 0.28;
    const padBottom = br.height * 0.28;
    if (ar.top < br.top + padTop) box.scrollTo({ top: box.scrollTop - (br.top + padTop - ar.top), behavior: 'smooth' });
    else if (ar.bottom > br.bottom - padBottom) box.scrollTo({ top: box.scrollTop + (ar.bottom - (br.bottom - padBottom)), behavior: 'smooth' });
  };

  let cur = null;
  const onScroll = () => {
    const line = window.scrollY + 96;
    /* 到底兜底：最后一个标题往往离页尾很近，永远越不过 96px 那条线，
       于是读完最后一段目录还停在第 7 项。滚到底就直接认最后一项。 */
    const atBottom = Math.ceil(window.scrollY + innerHeight) >= document.documentElement.scrollHeight - 2;
    let active = pairs[0][0];
    let activeLink = pairs[0][1];
    if (atBottom) {
      active = pairs[pairs.length - 1][0];
      const last = all.filter((x) => x.dataset.toc === active.id);
      activeLink = last.find((x) => x.offsetParent !== null) || last[0] || activeLink;
    }
    for (const [el, a] of (atBottom ? [] : pairs)) {
      if (el.getBoundingClientRect().top + window.scrollY <= line) {
        active = el;
        // 同一标题在桌面与抽屉里各有一条链接，优先记可见的那条
        const links = all.filter((x) => x.dataset.toc === el.id);
        activeLink = links.find((x) => x.offsetParent !== null) || links[0] || a;
      }
    }

    // 进度条：端点落在当前项的中点，transitions 让它是滑过去的
    if (ol) {
      const li = activeLink.closest('li');
      if (li) {
        const oR = ol.getBoundingClientRect();
        const lR = li.getBoundingClientRect();
        const p = oR.height ? ((lR.top + lR.height / 2 - oR.top) / oR.height) * 100 : 0;
        ol.style.setProperty('--toc-p', Math.max(0, Math.min(100, p)).toFixed(1) + '%');
      }
    }

    if (active === cur) return;
    cur = active;
    for (const a of all) a.classList.toggle('on', a.dataset.toc === active.id);
    keepVisible(activeLink);
  };

  let raf = 0;
  const tick = () => { raf = 0; onScroll(); };
  const onEvt = () => { if (!raf) raf = requestAnimationFrame(tick); };
  addEventListener('scroll', onEvt, { passive: true });
  addEventListener('resize', onEvt);
  tick();
}

/* 窄屏目录：从已有的桌面目录复制一份到底部抽屉，不重算标题、不碰 SSR 结构 */
function mountMobileToc() {
  const src = document.querySelectorAll('.post-toc a[data-toc]');
  if (!src.length || document.querySelector('.mtoc')) return;

  const btn = document.createElement('button');
  btn.className = 'mtoc-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label', '打开目录');
  btn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">' +
    '<path d="M4 7h16M4 12h11M4 17h7"/></svg><span>目录</span><span class="n">' + src.length + '</span>';

  const wrap = document.createElement('div');
  wrap.className = 'mtoc';
  // href 直接照抄桌面那条：SSR 里是 `#<中文id>`，自己再 encode 一遍会变成两种地址
  const items = [...src]
    .map((a) => `<a href="${a.getAttribute('href')}" data-toc="${a.dataset.toc}">${a.innerHTML}</a>`)
    .join('');
  wrap.innerHTML =
    '<div class="mtoc-mask" data-close></div>' +
    '<div class="mtoc-panel" role="dialog" aria-label="目录">' +
    '<div class="mtoc-head"><span>目录 · ' + src.length + ' 节</span>' +
    '<button class="mtoc-close" type="button" data-close>关闭</button></div>' +
    '<div class="mtoc-body">' + items + '</div></div>';

  document.body.append(btn, wrap);

  const open = () => {
    wrap.classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    const on = wrap.querySelector('a.on');
    if (on) on.scrollIntoView({ block: 'center' });
  };
  const close = () => {
    wrap.classList.remove('open');
    document.documentElement.style.overflow = '';
  };

  btn.addEventListener('click', open);
  wrap.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-toc]');
    if (a) { close(); return; }              // 交给浏览器做锚点跳转，scroll-margin-top 已处理吸顶遮挡
    if (e.target.closest('[data-close]')) close();
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  // 滚过文章头部才露出按钮：一进来就浮着太吵
  const btnSpy = () => {
    const head = document.querySelector('.post-head');
    const past = head ? scrollY > head.offsetTop + head.offsetHeight - 120 : scrollY > 300;
    btn.classList.toggle('on', past);
  };
  addEventListener('scroll', btnSpy, { passive: true });
  btnSpy();
}

USER = await mountHeader();
if (POST) {
  hydrate();
  mountMobileToc();
  bindTocSpy();
  loadComments();
} else {
  fallbackNotice();
}
</script>
</body>
</html>
